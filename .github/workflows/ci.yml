name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - lab1-staging
      - lab2-staging

jobs:
  client-build:
    name: Client Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  server-build:
    name: Server Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://toktickit:toktickit@localhost:5432/toktickit?schema=public"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy

      - name: Run seed (1st run)
        run: npm run prisma:seed

      - name: Verify seed idempotency (2nd run)
        run: npm run prisma:seed

      - name: Verify seeded records
        run: |
          npx tsx -e '
            import { getPrisma } from "./src/prisma.ts";
            const prisma = getPrisma();
            async function verify() {
              const catCount = await prisma.category.count();
              const sysCount = await prisma.relatedSystem.count();
              const totalReqCount = await prisma.requesterUser.count();
              const activeReqCount = await prisma.requesterUser.count({ where: { isActive: true } });
              const inactiveReqCount = await prisma.requesterUser.count({ where: { isActive: false } });
              if (catCount !== 4) throw new Error("Expected 4 categories, found " + catCount);
              if (sysCount !== 6) throw new Error("Expected 6 related systems, found " + sysCount);
              if (totalReqCount !== 5) throw new Error("Expected 5 total requesters, found " + totalReqCount);
              if (activeReqCount !== 4) throw new Error("Expected 4 active requesters, found " + activeReqCount);
              if (inactiveReqCount !== 1) throw new Error("Expected 1 inactive requester, found " + inactiveReqCount);
              console.log("Verified: 4 categories, 6 related systems, 5 requesters (4 active, 1 inactive) in DB.");
              process.exit(0);
            }
            verify().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build
